# PostgreSQL + pgvector
# Usage: docker compose up -d && ./scripts/verify.sh

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgvector/pgvector:pg16
    cpus: "0.5"
    container_name: hubx-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectorx
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgvector-data:

networks:
  default:
    name: hubx-pgvector-net
    driver: bridge
